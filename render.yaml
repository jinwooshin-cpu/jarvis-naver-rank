services:
  - type: web
    name: jarvis-naver-rank
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: CACHE_TTL
        value: "600"
